name: Build and publish

# Shared pipeline (lint, plugin JSON, demo wiki, GitHub Pages): see
# https://github.com/nikorion/tw-dev/blob/main/.github/workflows/site.yml

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    uses: nikorion/tw-dev/.github/workflows/site.yml@main
    with:
      deploy: ${{ github.event_name != 'pull_request' }}
